<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cwoffin - Embodied Helplessness</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: monospace; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: filter 0.15s; }
  #ui { position: fixed; bottom: 20px; left: 20px; color: rgba(255, 255, 255, 0.35); pointer-events: none; opacity: 0; transition: opacity 2s; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at center, transparent var(--clear, 12%), rgba(5,0,0,var(--dark,0.94)) 75%, #000 100%);
  }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #ending {
    position: fixed; inset: 0; background: #000; color: #ccc; display: flex; align-items: center; justify-content: center;
    text-align: center; opacity: 0; pointer-events: none; transition: opacity 4s; letter-spacing: 2px; font-size: 1.3em;
  }
  #ending.show { opacity: 1; pointer-events: all; }
  #ending .sub { font-size: 0.55em; opacity: 0.4; margin-top: 1.2em; letter-spacing: 1px; }
  kbd { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="flash"></div>
<div id="ending"><div><div id="endingText"></div><div class="sub">press R to be buried again</div></div></div>
<div id="ui">
  <div>Motor Intentions:</div>
  <div><kbd>Q</kbd> Curl Left Arm | <kbd>E</kbd> Curl Right Arm</div>
  <div><kbd>Z</kbd> Curl Left Leg | <kbd>C</kbd> Curl Right Leg</div>
  <div><kbd>Space</kbd> Push Against The Lid</div>
  <div><kbd>Mouse</kbd> Struggle to look around</div>
  <div style="margin-top:6px; opacity:0.6;">Stay calm to conserve air. Push the lid to escape.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';

// Helpers
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const V3 = THREE.Vector3, Q4 = THREE.Quaternion;

// Scene setup
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setClearColor(0x000000); // Black background

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x000000, 3.0, 8.0); // Gentle fog for depth

const ambient = new THREE.AmbientLight(0x4a4860, 3.0); // Atmospheric purple light
scene.add(ambient);

console.log('Scene initialized with', scene.children.length, 'children');

// Coffin Dimensions - MUST BE BEFORE CAMERA
const CX = 0.35, CY = 0.30, CZ = 1.0; 

// Camera
const camera = new THREE.PerspectiveCamera(85, 1, 0.001, 1000);
// Camera will follow head via updateCamera() with proper mouse-responsive forward vector 

const skyLight = new THREE.PointLight(0xcfe0ff, 4.0, 3.0, 1.8);
skyLight.position.set(0, CY + 0.4, -0.15);
scene.add(skyLight);
const skyLightBase = 4.0;

// Coffin Visuals - Simplified for performance
const lidMat = new THREE.MeshStandardMaterial({ color: 0x3d2815, roughness: 0.9, side: THREE.DoubleSide }); // DoubleSide renders both
const wallMat = new THREE.MeshStandardMaterial({ color: 0x554433, roughness: 0.85, side: THREE.DoubleSide });
const botMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9, side: THREE.DoubleSide });
const hiddenMat = new THREE.MeshBasicMaterial({ visible: false });

// The 5 fixed faces (walls + floor). The top face is left invisible here —
// the lid is its own mesh below so it can move independently (shaking on impact).
const coffinGeo = new THREE.BoxGeometry(CX * 2, CY * 2, CZ * 2);
const coffinMesh = new THREE.Mesh(coffinGeo, [wallMat, wallMat, hiddenMat, botMat, wallMat, wallMat]);
scene.add(coffinMesh);

// Lid as its own rigid body (visual only) so it can jitter on shovel/creak impacts
const lidThickness = 0.05;
const lidGeo = new THREE.BoxGeometry(CX * 2, lidThickness, CZ * 2);
const lidMesh = new THREE.Mesh(lidGeo, [wallMat, wallMat, wallMat, lidMat, wallMat, wallMat]);
const lidRestY = CY + lidThickness / 2;
lidMesh.position.set(0, lidRestY, 0);
scene.add(lidMesh);
let lidShakeAmt = 0;
function shakeLid(amt) { lidShakeAmt = Math.max(lidShakeAmt, amt); }
function updateLidShake(dt) {
  lidShakeAmt = Math.max(0, lidShakeAmt - dt * 2.2);
  const s = lidShakeAmt * 0.012;
  lidMesh.position.set((Math.random() - 0.5) * s, lidRestY + (Math.random() - 0.5) * s * 0.6, (Math.random() - 0.5) * s);
  lidMesh.rotation.set((Math.random() - 0.5) * s * 0.4, 0, (Math.random() - 0.5) * s * 0.4);
}

// A literal sliver of light along the seam of the lid — this is the "scenery"
// the player actually sees during the intro, rather than an implied glow.
// It shrinks and dims as the burial proceeds, then never returns.
const seamMat = new THREE.MeshBasicMaterial({ color: 0xcfe0ff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
const seamGeo = new THREE.PlaneGeometry(CX * 1.6, 0.12);
const seamMesh = new THREE.Mesh(seamGeo, seamMat);
seamMesh.rotation.x = Math.PI / 2;
seamMesh.position.set(0, CY - 0.002, -0.15);
scene.add(seamMesh);

// Firefly Setup - Biological Light
const fireflyGeo = new THREE.SphereGeometry(0.003, 6, 6);
const fireflyMat = new THREE.MeshBasicMaterial({ color: 0x99ff66, transparent: true, opacity: 0.8 });
const fireflyMesh = new THREE.Mesh(fireflyGeo, fireflyMat);
scene.add(fireflyMesh);

const fireflyLight = new THREE.PointLight(0x99ff66, 3.0, 4.0, 1.4); // Brighter, farther reaching
fireflyMesh.add(fireflyLight);

const hallucinationLight = new THREE.PointLight(0xffaa55, 0.0, 0.8, 2.0);
scene.add(hallucinationLight);

let fireflyTime = 0, fireflyWander = new V3(0, CY - 0.05, 0.2);
let fireflyNextFlash = 0, fireflyIsFlashing = true, fireflyFlashDur = 0.3;

// --- PHYSICS ENGINE ---
const NP = 13;
const IX = { HEAD:0, SHL:1, SHR:2, HPL:3, HPR:4, ELL:5, ELR:6, HDL:7, HDR:8, KNL:9, KNR:10, FTL:11, FTR:12 };
const REST = [
  [0, CY - 0.15, -0.7], [-0.20, CY - 0.2, -0.4], [0.20, CY - 0.2, -0.4],
  [-0.15, CY - 0.2, 0.1], [0.15, CY - 0.2, 0.1], [-0.25, CY - 0.2, -0.1], [0.25, CY - 0.2, -0.1],
  [-0.28, CY - 0.2, 0.2], [0.28, CY - 0.2, 0.2], [-0.15, CY - 0.2, 0.5], [0.15, CY - 0.2, 0.5],
  [-0.15, CY - 0.2, 0.9], [0.15, CY - 0.2, 0.9]
];
const BASE_M = [5, 6, 6, 7, 7, 1.8, 1.8, 0.9, 0.9, 4, 4, 1.6, 1.6];
const MASS = BASE_M.map(m => m * 80 / BASE_M.reduce((a, b) => a + b, 0));
const P = [], O = [], F = [];
for (let i = 0; i < NP; i++) { P.push(new V3(...REST[i])); O.push(new V3(...REST[i])); F.push(new V3()); }
const CONS = [];
const con = (a, b, lo, hi) => CONS.push({ a, b, lo, hi: hi === undefined ? lo : hi, wa: 1 / MASS[a], wb: 1 / MASS[b] });
const rv = i => new V3(...REST[i]);
const rd = (a, b) => rv(a).distanceTo(rv(b));
for (const [a, b] of [[IX.SHL,IX.SHR],[IX.HPL,IX.HPR],[IX.SHL,IX.HPL],[IX.SHR,IX.HPR],[IX.SHL,IX.HPR],[IX.SHR,IX.HPL]]) con(a, b, rd(a, b));
con(IX.HEAD, IX.SHL, rd(IX.HEAD, IX.SHL)); con(IX.HEAD, IX.SHR, rd(IX.HEAD, IX.SHR)); 
for (const [s, e, h] of [[IX.SHL, IX.ELL, IX.HDL], [IX.SHR, IX.ELR, IX.HDR]]) { con(s, e, rd(s, e)); con(e, h, rd(e, h)); con(s, h, 0.05, rd(s, e) + rd(e, h)); }
for (const [s, e, h] of [[IX.HPL, IX.KNL, IX.FTL], [IX.HPR, IX.KNR, IX.FTR]]) { con(s, e, rd(s, e)); con(e, h, rd(e, h)); con(s, h, 0.05, rd(s, e) + rd(e, h)); }
const SEGS = [ [IX.SHL, IX.ELL], [IX.ELL, IX.HDL], [IX.SHR, IX.ELR], [IX.ELR, IX.HDR], [IX.HPL, IX.KNL], [IX.KNL, IX.FTL], [IX.HPR, IX.KNR], [IX.KNR, IX.FTR] ];

// --- RAGDOLL MESHES ---
const bodyGroup = new THREE.Group(); 
scene.add(bodyGroup);
const skinMat = new THREE.MeshStandardMaterial({ color: 0x7a5a4c, roughness: 0.85, side: THREE.DoubleSide }); // DoubleSide to avoid clipping
const shirtMat = new THREE.MeshStandardMaterial({ color: 0x24282f, roughness: 0.95, side: THREE.DoubleSide });
const boneMesh = SEGS.map((_, i) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,6), i > 3 ? shirtMat : skinMat); m.userData.r = 0.04; bodyGroup.add(m); return m; });
const torsoMesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), shirtMat); bodyGroup.add(torsoMesh);
const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), skinMat); 
headMesh.visible = false; // Hide head so camera doesn't clip through it
bodyGroup.add(headMesh);
const _a = new V3(), _up = new V3(0, 1, 0);
function updateMeshes() {
  for (let i = 0; i < SEGS.length; i++) {
    const a = P[SEGS[i][0]], b = P[SEGS[i][1]], m = boneMesh[i];
    _a.subVectors(b, a); const len = _a.length() || 0.001;
    m.position.addVectors(a, b).multiplyScalar(0.5);
    m.scale.set(m.userData.r, len, m.userData.r);
    m.quaternion.setFromUnitVectors(_up, _a.normalize());
  }
  const shMid = new V3().addVectors(P[IX.SHL], P[IX.SHR]).multiplyScalar(0.5);
  const hpMid = new V3().addVectors(P[IX.HPL], P[IX.HPR]).multiplyScalar(0.5);
  torsoMesh.position.addVectors(shMid, hpMid).multiplyScalar(0.5);
  _a.subVectors(hpMid, shMid); const tLen = _a.length() || 0.001;
  const right = new V3().subVectors(P[IX.SHR], P[IX.SHL]).normalize();
  const torsoUp = _a.clone().normalize(); // Keep reference to torso up for camera
  const fwd = new V3().crossVectors(right, torsoUp).normalize();
  const m4 = new THREE.Matrix4().makeBasis(right, _a, fwd);
  torsoMesh.quaternion.setFromRotationMatrix(m4);
  torsoMesh.scale.set(0.35, tLen + 0.1, 0.2);
  headMesh.position.copy(P[IX.HEAD]);
  
  // Camera forward = actual neck-to-head direction (reflects mouse input)
  _rawCamFwd.subVectors(P[IX.HEAD], shMid).normalize();
  // Camera position slightly forward of head
  _rawCamPos.copy(P[IX.HEAD]).addScaledVector(_rawCamFwd, 0.15);
  // Camera up = body's right vector (never parallel to forward)
  _rawCamUp.copy(right);
}
}

const _rawCamPos = new V3(0, CY - 0.1, -0.7), _rawCamFwd = new V3(0, 0, 1), _rawCamUp = new V3(1, 0, 0);
let _smoothPos = null;
const _smoothFwd = new V3(0, 0, 1);
const _smoothUp = new V3(1, 0, 0);
let camShake = 0, targetFov = 85;

function updateCamera(dt) {
  if (!_smoothPos) { 
    _smoothPos = _rawCamPos.clone(); 
    _smoothFwd.copy(_rawCamFwd);
    _smoothUp.copy(_rawCamUp);
  }
  const posLerp = 1 - Math.exp(-dt * 10);
  const fwdLerp = 1 - Math.exp(-dt * 8);
  _smoothPos.lerp(_rawCamPos, posLerp);
  _smoothFwd.lerp(_rawCamFwd, fwdLerp).normalize();
  _smoothUp.lerp(_rawCamUp, fwdLerp).normalize();
  
  camShake = Math.max(0, camShake - dt * 3);
  const shakeAmt = camShake * 0.01;
  camera.position.copy(_smoothPos);
  
  // CO2 wave camera drift
  if (co2DetachmentWave > 0) {
    const driftIntensity = co2DetachmentWave * 0.015;
    camera.position.x += Math.sin(co2WaveTimer * 0.5) * driftIntensity;
    camera.position.y += Math.cos(co2WaveTimer * 0.7) * driftIntensity * 0.5;
  }
  
  if (shakeAmt > 0.0001) camera.position.set(
    camera.position.x + (Math.random() - 0.5) * shakeAmt,
    camera.position.y + (Math.random() - 0.5) * shakeAmt,
    camera.position.z + (Math.random() - 0.5) * shakeAmt
  );
  const lookTarget = new V3().copy(camera.position).addScaledVector(_smoothFwd, 1);
  camera.up.copy(_smoothUp); // Use body's right as up (never parallel to forward)
  camera.lookAt(lookTarget);
  camera.fov = lerp(camera.fov, targetFov, dt * 2);
  camera.updateProjectionMatrix();
}

// --- SURVIVAL STATE ---
let oxygen = 100, panic = 0, fatigue = 0, lidStress = 0, gameState = 'intro';
let heartTimer = 0, breathPhase = 0, creakCooldown = 0, dirtCooldown = 2 + Math.random() * 3, struggling = false;
let cssUpdateCounter = 0; // throttle CSS updates for performance
const INTRO_THUDS = [0.7, 2.5, 4.4, 6.7, 9.1, 11.4]; const INTRO_END = 13.0;
let introTimer = 0, introIndex = 0, afterImageTimer = 0;

// CO2 Detachment Wave System
let co2DetachmentWave = 0;
let co2WaveTimer = 0;
let co2WaveCooldown = 0;
let co2WaveDuration = 0;

// Hallucinated Presence System
let presenceWhisperCooldown = 0;

// --- AUDIO ---
let actx = null, masterGain, masterFilter, breathGain, breathFilter, droneGain, noiseBuffer;
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = actx.createGain(); masterGain.gain.value = 0.55;
  masterFilter = actx.createBiquadFilter(); masterFilter.type = 'lowpass'; masterFilter.frequency.value = 20000;
  masterGain.connect(masterFilter).connect(actx.destination);

  const bufSize = actx.sampleRate * 2;
  noiseBuffer = actx.createBuffer(1, bufSize, actx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

  const breathSrc = actx.createBufferSource();
  breathSrc.buffer = noiseBuffer; breathSrc.loop = true;
  breathFilter = actx.createBiquadFilter(); breathFilter.type = 'bandpass'; breathFilter.frequency.value = 500; breathFilter.Q.value = 0.6;
  breathGain = actx.createGain(); breathGain.gain.value = 0.0;
  breathSrc.connect(breathFilter).connect(breathGain).connect(masterGain);
  breathSrc.start();

  droneGain = actx.createGain(); droneGain.gain.value = 0.035; droneGain.connect(masterGain);
  const o1 = actx.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54; o1.connect(droneGain); o1.start();
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = 57.5; o2.connect(droneGain); o2.start();
}
function playHeartbeat(strength) {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(60, t); osc.frequency.exponentialRampToValueAtTime(28, t + 0.16);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5 * strength, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  osc.connect(g).connect(masterGain); osc.start(t); osc.stop(t + 0.3);
}
function playCreak(strength) {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const filt = actx.createBiquadFilter(); filt.type = 'bandpass';
  const f0 = 180 + Math.random() * 500;
  filt.frequency.setValueAtTime(f0, t); filt.frequency.exponentialRampToValueAtTime(f0 * 0.45, t + 0.5);
  filt.Q.value = 9;
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(clamp(0.55 * strength, 0, 0.6), t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45 + Math.random() * 0.3);
  src.connect(filt).connect(g).connect(masterGain); src.start(t); src.stop(t + 0.9);
}
function playSandCascade(strength, grains, spread) {
  if (!actx) return;
  const t0 = actx.currentTime;
  for (let i = 0; i < grains; i++) {
    const start = t0 + Math.random() * spread;
    const src = actx.createBufferSource(); src.buffer = noiseBuffer;
    const filt = actx.createBiquadFilter(); filt.type = 'bandpass';
    filt.frequency.value = 1800 + Math.random() * 5000;
    filt.Q.value = 2.5 + Math.random() * 4;
    const g = actx.createGain(); g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(0.025 * strength * (0.4 + Math.random() * 0.8), start + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, start + 0.015 + Math.random() * 0.035);
    src.connect(filt).connect(g).connect(masterGain);
    src.start(start); src.stop(start + 0.1);
  }
}
function playShovelThud(strength) {
  if (!actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(50, t); osc.frequency.exponentialRampToValueAtTime(24, t + 0.3);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35 * strength, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
  osc.connect(g).connect(masterGain); osc.start(t); osc.stop(t + 0.45);
  
  const thumpSrc = actx.createBufferSource(); thumpSrc.buffer = noiseBuffer;
  const thumpFilt = actx.createBiquadFilter(); thumpFilt.type = 'lowpass'; thumpFilt.frequency.value = 200;
  const thumpGain = actx.createGain(); thumpGain.gain.setValueAtTime(0.0001, t);
  thumpGain.gain.exponentialRampToValueAtTime(0.18 * strength, t + 0.01);
  thumpGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  thumpSrc.connect(thumpFilt).connect(thumpGain).connect(masterGain); thumpSrc.start(t); thumpSrc.stop(t + 0.2);
  playSandCascade(strength, 45 + Math.floor(Math.random() * 30), 0.55 + Math.random() * 0.35);
}
function playDirtFall() { playSandCascade(0.35 + Math.random() * 0.25, 10 + Math.floor(Math.random() * 10), 0.3); }
function playEscapeSwell() {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(80, t); o.frequency.linearRampToValueAtTime(220, t + 2.5);
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.25, t + 1.5); g.gain.linearRampToValueAtTime(0.0001, t + 3.5);
  o.connect(g).connect(masterGain); o.start(t); o.stop(t + 3.6);
}
function playHallucination() {
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuffer;
  const filt = actx.createBiquadFilter(); filt.type = 'bandpass';
  filt.frequency.value = 800 + Math.random() * 400;
  filt.Q.value = 15;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.08, t + 0.2);
  g.gain.linearRampToValueAtTime(0.0001, t + 1.2);
  src.connect(filt).connect(g).connect(masterGain);
  src.start(t); src.stop(t + 1.5);
}

function playPresenceWhisper() {
  if (!actx) return;
  const t = actx.currentTime;
  
  // Low frequency rumble (voice-like quality)
  const osc = actx.createOscillator();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120 + Math.random() * 80, t);
  osc.frequency.exponentialRampToValueAtTime(100 + Math.random() * 60, t + 1.0);
  
  // Filtered noise for texture
  const src = actx.createBufferSource();
  src.buffer = noiseBuffer;
  const filt = actx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = 200 + Math.random() * 200;
  filt.Q.value = 3.5;
  
  // Very quiet gain with slow attack/decay
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.05 + Math.random() * 0.03, t + 0.3); // Slow attack
  g.gain.linearRampToValueAtTime(0.0001, t + 1.3); // Long decay
  
  // Spatial positioning - slightly offset
  const panner = actx.createStereoPanner();
  panner.pan.value = (Math.random() - 0.5) * 0.6; // Subtle left/right
  
  osc.connect(g);
  src.connect(filt).connect(g);
  g.connect(panner).connect(masterGain);
  
  osc.start(t);
  osc.stop(t + 1.5);
  src.start(t);
  src.stop(t + 1.5);
}

function updateVitalsAudio(dt, panicLevel, oxygenLevel) {
  let bpm = lerp(52, 150, panicLevel);
  let strength = 0.3 + panicLevel * 0.75;
  if (oxygenLevel < 10) {
    bpm = lerp(bpm, 30, (10 - oxygenLevel) / 10);
    strength = lerp(strength, 0.05, (10 - oxygenLevel) / 10);
  }
  if (oxygenLevel <= 0) strength = 0;

  heartTimer += dt;
  if (heartTimer >= 60 / bpm && strength > 0.05) { heartTimer = 0; playHeartbeat(strength); }
  
  const breathHz = lerp(0.2, 0.85, panicLevel);
  breathPhase += dt * breathHz * Math.PI * 2;
  const env = Math.pow(Math.sin(breathPhase) * 0.5 + 0.5, 2);
  
  let bVol = 0.03 + env * (0.07 + panicLevel * 0.22);
  if (oxygenLevel < 10) bVol = lerp(bVol, 0, (10 - oxygenLevel) / 10);
  
  if (breathGain) breathGain.gain.value = bVol;
  if (breathFilter) breathFilter.frequency.value = 420 + env * 300 + panicLevel * 200;

  // PHASE 2: Hearing Muffling (Second to fail) - panic > 0.65 OR oxygen < 30
  const hearingPhase2 = Math.max(
    (panicLevel - 0.65) / 0.35,
    (30 - oxygenLevel) / 30
  );
  
  if (hearingPhase2 > 0) {
    const muffleAmount = clamp(hearingPhase2, 0, 1);
    if (actx) masterFilter.frequency.setTargetAtTime(lerp(20000, 600, muffleAmount), actx.currentTime, 0.1);
  } else {
    if (actx) masterFilter.frequency.setTargetAtTime(20000, actx.currentTime, 0.1);
  }
}

// --- DUST / DEBRIS PARTICLES ---
const MAX_DUST = 40;
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(MAX_DUST * 3);
const dustVel = [];
const dustLife = new Float32Array(MAX_DUST);
for (let i = 0; i < MAX_DUST; i++) dustVel.push(new V3());
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0x8a7358, size: 0.012, transparent: true, opacity: 0.7, depthWrite: false });
const dustPoints = new THREE.Points(dustGeo, dustMat);
scene.add(dustPoints);
let dustCursor = 0;
function spawnDust(pos, n, count) {
  for (let k = 0; k < count; k++) {
    const i = dustCursor; dustCursor = (dustCursor + 1) % MAX_DUST;
    dustPos[i * 3] = pos.x; dustPos[i * 3 + 1] = pos.y; dustPos[i * 3 + 2] = pos.z;
    dustVel[i].set((Math.random() - 0.5) * 0.3, Math.random() * 0.2, (Math.random() - 0.5) * 0.3).addScaledVector(n, 0.3 + Math.random() * 0.3);
    dustLife[i] = 0.6 + Math.random() * 0.6;
  }
}
function updateDust(dt, oxygenLevel, panicLevel) {
  let timeScale = 1.0;
  if (oxygenLevel < 5) timeScale = 0.05; // hangs motionless
  else if (panicLevel > 0.9) timeScale = 0.2; // time dilation

  for (let i = 0; i < MAX_DUST; i++) {
    if (dustLife[i] <= 0) continue;
    dustLife[i] -= dt * timeScale;
    dustVel[i].y -= 0.4 * dt * timeScale;
    dustPos[i * 3] += dustVel[i].x * dt * timeScale;
    dustPos[i * 3 + 1] += dustVel[i].y * dt * timeScale;
    dustPos[i * 3 + 2] += dustVel[i].z * dt * timeScale;
    if (dustLife[i] <= 0) dustPos[i * 3 + 1] = -999;
  }
  dustGeo.attributes.position.needsUpdate = true;
}

let dyingTimer = 0;
const DYING_DURATION = 3.4;
function updateDying(dt) {
  dyingTimer += dt;
  const t = clamp(dyingTimer / DYING_DURATION, 0, 1);
  const bpm = lerp(150, 20, t * t);
  const strength = lerp(0.5, 0.015, t);
  heartTimer += dt;
  if (heartTimer >= 60 / bpm && strength > 0.02) { heartTimer = 0; playHeartbeat(strength); }
  if (breathGain) breathGain.gain.value = lerp(breathGain.gain.value, 0, dt * 1.2);
  if (actx) masterFilter.frequency.setTargetAtTime(lerp(400, 18000, t), actx.currentTime, 0.5);
  if (droneGain) droneGain.gain.setTargetAtTime(lerp(0.035, 0.008, t), actx ? actx.currentTime : 0, 0.6);

  cssUpdateCounter++;
  if (cssUpdateCounter >= 2) {
    cssUpdateCounter = 0;
    document.documentElement.style.setProperty('--clear', (lerp(6, 20, t)).toFixed(1) + '%');
    document.documentElement.style.setProperty('--dark', lerp(0.985, 0.6, t).toFixed(3));
    document.getElementById('c').style.filter = `grayscale(${lerp(1, 0.4, t).toFixed(2)}) blur(${lerp(3, 0, t).toFixed(1)}px) contrast(${lerp(0.5, 0.9, t).toFixed(2)})`;
  }
  updateFirefly(dt, lerp(3, 45, t), lerp(0.9, 0.02, t));

  if (dyingTimer >= DYING_DURATION) {
    gameState = 'lost';
    const el = document.getElementById('ending');
    const txt = document.getElementById('endingText');
    txt.textContent = 'Stay still. Stay calm. Stay—';
    setTimeout(() => el.classList.add('show'), 900);
  }
}

function endGame(state) {
  if (gameState !== 'playing') return;
  if (state === 'lost') {
    gameState = 'dying';
    dyingTimer = 0;
    document.getElementById('ui').style.opacity = '0';
    return;
  }
  gameState = state;
  const el = document.getElementById('ending');
  const txt = document.getElementById('endingText');
  document.getElementById('ui').style.opacity = '0';
  {
    playEscapeSwell();
    const fl = document.getElementById('flash');
    fl.style.transition = 'opacity 0.15s'; fl.style.opacity = '1';
    setTimeout(() => { fl.style.transition = 'opacity 2.5s'; fl.style.opacity = '0'; }, 200);
    for (let i = 0; i < 8; i++) setTimeout(() => spawnDust(P[IX.HEAD], new V3(0, 1, 0), 15), i * 120);
    txt.textContent = 'The lid gives way.';
    setTimeout(() => el.classList.add('show'), 2500);
  }
}

// --- INPUT & MOTOR INTENTIONS ---
const keys = {};
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
let mouseX = 0, mouseY = 0;
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement === document.body) {
    mouseX = clamp(mouseX + e.movementX * 0.003, -1.2, 1.2);
    mouseY = clamp(mouseY - e.movementY * 0.003, -0.8, 1.2);
  }
});
document.body.addEventListener('click', () => { document.body.requestPointerLock(); initAudio(); });
window.addEventListener('keydown', e => { if (e.code === 'KeyR' && (gameState === 'lost' || gameState === 'won')) location.reload(); });

let exertionThisFrame = 0, lidPushThisFrame = false;
function applyMotors(dt) {
  for (let i = 0; i < NP; i++) F[i].set(0, -9.81 * MASS[i], 0);

  const desperation = clamp((100 - oxygen) / 80, 0.4, 1.0); // early efforts feel slightly less effective
  const forceMul = lerp(1.0, 0.3, fatigue) * desperation; 
  const curlForce = 350 * forceMul;
  exertionThisFrame = 0; lidPushThisFrame = false;
  const active = gameState === 'playing';

  if (active && keys['KeyQ']) { const dir = new V3().subVectors(P[IX.SHL], P[IX.HDL]).normalize(); F[IX.HDL].addScaledVector(dir, curlForce); exertionThisFrame += 0.22; }
  if (active && keys['KeyE']) { const dir = new V3().subVectors(P[IX.SHR], P[IX.HDR]).normalize(); F[IX.HDR].addScaledVector(dir, curlForce); exertionThisFrame += 0.22; }
  if (active && keys['KeyZ']) { const dir = new V3().subVectors(P[IX.HPL], P[IX.FTL]).normalize(); F[IX.FTL].addScaledVector(dir, curlForce); exertionThisFrame += 0.22; }
  if (active && keys['KeyC']) { const dir = new V3().subVectors(P[IX.HPR], P[IX.FTR]).normalize(); F[IX.FTR].addScaledVector(dir, curlForce); exertionThisFrame += 0.22; }
  
  if (active && keys['Space']) {
    const pushMul = forceMul;
    F[IX.HPL].y += 80 * pushMul; F[IX.HPR].y += 80 * pushMul;
    F[IX.SHL].y += 120 * pushMul; F[IX.SHR].y += 120 * pushMul;
    exertionThisFrame += 0.5;
    const nearLid = (CY - P[IX.SHL].y < 0.03) || (CY - P[IX.SHR].y < 0.03);
    if (nearLid && fatigue < 0.85) lidPushThisFrame = true;
  }

  const shMid = new V3().addVectors(P[IX.SHL], P[IX.SHR]).multiplyScalar(0.5);
  const hpMid = new V3().addVectors(P[IX.HPL], P[IX.HPR]).multiplyScalar(0.5);
  const torsoUpLocal = new V3().subVectors(shMid, hpMid).normalize();
  const rightLocal = new V3().subVectors(P[IX.SHR], P[IX.SHL]).normalize();
  const fwdLocal = new V3().crossVectors(rightLocal, torsoUpLocal).normalize();

  const targetNeckDir = new V3().copy(torsoUpLocal).multiplyScalar(Math.cos(mouseY))
      .addScaledVector(fwdLocal, Math.sin(mouseY));
  targetNeckDir.applyAxisAngle(torsoUpLocal, -mouseX);
  const neckLen = 0.25; 
  const targetHeadPos = new V3().copy(shMid).addScaledVector(targetNeckDir, neckLen);
  const neckForce = new V3().subVectors(targetHeadPos, P[IX.HEAD]).multiplyScalar(200);
  F[IX.HEAD].add(neckForce);
}

let impactEnergy = 0, impactPos = null, impactNormal = null;
function physicsStep(dt) {
  applyMotors(dt);

  const dtt = dt * dt, damp = Math.exp(-1.5 * dt);
  impactEnergy = 0; impactPos = null; impactNormal = null;

  for (let i = 0; i < NP; i++) {
    const p = P[i], o = O[i];
    const ax = F[i].x / MASS[i], ay = F[i].y / MASS[i], az = F[i].z / MASS[i];
    const vx = (p.x - o.x) * damp, vy = (p.y - o.y) * damp, vz = (p.z - o.z) * damp;
    o.copy(p);
    p.x += vx + ax * dtt; p.y += vy + ay * dtt; p.z += vz + az * dtt;

    const pr = 0.05;
    let hit = false, nx = 0, ny = 0, nz = 0;
    const speed = Math.hypot(vx, vy, vz);
    if (p.x < -CX + pr) { p.x = -CX + pr; o.x = p.x; o.y = lerp(o.y, p.y, 0.3); o.z = lerp(o.z, p.z, 0.3); hit = true; nx = 1; }
    if (p.x >  CX - pr) { p.x =  CX - pr; o.x = p.x; o.y = lerp(o.y, p.y, 0.3); o.z = lerp(o.z, p.z, 0.3); hit = true; nx = -1; }
    if (p.y < -CY + pr) { p.y = -CY + pr; o.y = p.y; o.x = lerp(o.x, p.x, 0.3); o.z = lerp(o.z, p.z, 0.3); hit = true; ny = 1; }
    if (p.y >  CY - pr) { p.y =  CY - pr; o.y = p.y; o.x = lerp(o.x, p.x, 0.3); o.z = lerp(o.z, p.z, 0.3); hit = true; ny = -1; }
    if (p.z < -CZ + pr) { p.z = -CZ + pr; o.z = p.z; o.x = lerp(o.x, p.x, 0.3); o.y = lerp(o.y, p.y, 0.3); hit = true; nz = 1; }
    if (p.z >  CZ - pr) { p.z =  CZ - pr; o.z = p.z; o.x = lerp(o.x, p.x, 0.3); o.y = lerp(o.y, p.y, 0.3); hit = true; nz = -1; }
    if (hit && speed > 0.004) {
      const e = speed * MASS[i];
      if (e > impactEnergy) { impactEnergy = e; impactPos = p.clone(); impactNormal = new V3(nx, ny, nz); }
    }

    for (let j = 0; j < i; j++) {
      const p2 = P[j];
      _a.subVectors(p, p2);
      const dist = _a.length();
      const minDist = 0.12;
      if (dist > 0.0001 && dist < minDist) {
        const push = (minDist - dist) * 0.5;
        _a.normalize().multiplyScalar(push);
        p.add(_a);
        p2.sub(_a);
      }
    }
  }

  for (let iter = 0; iter < 4; iter++) {
    for (let k = 0; k < CONS.length; k++) {
      const c = CONS[k], A = P[c.a], B = P[c.b];
      _a.subVectors(B, A); const len = _a.length() || 1e-6;
      let target = len; 
      if (len < c.lo) target = c.lo; 
      else if (len > c.hi) target = c.hi; 
      else continue;
      const diff = (len - target) / len, w = c.wa + c.wb;
      A.addScaledVector(_a, diff * c.wa / w); 
      B.addScaledVector(_a, -diff * c.wb / w);
    }
  }
}

function updateIntro(dt) {
  introTimer += dt;
  struggling = !!(keys['KeyQ'] || keys['KeyE'] || keys['KeyZ'] || keys['KeyC'] || keys['Space']);

  panic = clamp(panic + (struggling ? dt * 0.09 : -dt * 0.04), 0, 0.42);
  updateVitalsAudio(dt, panic, 100);

  if (introIndex < INTRO_THUDS.length && introTimer >= INTRO_THUDS[introIndex]) {
    playShovelThud(0.55 + Math.random() * 0.35);
    camShake = Math.max(camShake, 0.9 + Math.random() * 0.6);
    shakeLid(1.1 + Math.random() * 0.5);
    introIndex++;
    spawnDust(new V3((Math.random()-0.5)*CX, CY - 0.05, (Math.random()-0.5)*CZ), new V3(0,-1,0), 5);
  }
  const stepLight = 1 - introIndex / INTRO_THUDS.length;
  const introProgress = clamp(introTimer / INTRO_END, 0, 1);
  skyLight.intensity = skyLightBase * stepLight * (0.85 + Math.random() * 0.15) * (1 - introProgress * 0.3);
  seamMat.opacity = clamp(skyLight.intensity / skyLightBase, 0, 1) * 0.85;
  const seamShrink = lerp(1, 0.03, introProgress);
  seamMesh.scale.set(seamShrink, seamShrink, 1);

  // Throttle CSS updates - only every 3 frames
  cssUpdateCounter++;
  if (cssUpdateCounter >= 3) {
    cssUpdateCounter = 0;
    document.documentElement.style.setProperty('--clear', lerp(24, 13, introProgress).toFixed(1) + '%');
    document.documentElement.style.setProperty('--dark', lerp(0.45, 0.92, introProgress).toFixed(3));
  }

  if (introTimer >= INTRO_END) {
    gameState = 'playing';
    afterImageTimer = 3.0;
    oxygen = 100; fatigue = 0; lidStress = 0;
    panic = clamp(panic * 0.55, 0, 1);
    document.getElementById('ui').style.opacity = '1';
  }
}

function updateFirefly(dt, oxygenLevel, panicLevel) {
  fireflyTime += dt;
  fireflyWander.set(
    Math.sin(fireflyTime * 0.7) * 0.15,
    CY - 0.08 + Math.sin(fireflyTime * 1.3) * 0.02,
    0.2 + Math.cos(fireflyTime * 0.5) * 0.2
  );
  fireflyMesh.position.lerp(fireflyWander, dt * 1.5);

  let stage = 1;
  if (oxygenLevel < 60) stage = 2;
  if (oxygenLevel < 35) stage = 3;
  if (oxygenLevel < 20) stage = 4;
  if (oxygenLevel < 10) stage = 5;
  if (oxygenLevel < 5) stage = 6;
  
  let flashChance = 0.02, flashLength = 0.1, intensity = 0.4, fColor = new THREE.Color(0x99ff66);
  if (stage === 1) { flashChance = 0.05; flashLength = 0.15; intensity = 1.5; }
  else if (stage === 2) { flashChance = 0.03; flashLength = 0.1; intensity = 1.2; }
  else if (stage === 3) { flashChance = 0.015; flashLength = 0.08; intensity = 0.9; }
  else if (stage === 4) { flashChance = 0.01; flashLength = 0.05; intensity = 0.6; }
  else if (stage === 5) { flashChance = 1.0; flashLength = 0.3; intensity = 1.8; fColor.setHex(0xaaff88); }
  else if (stage === 6) { flashChance = 0.005; flashLength = 0.05; intensity = 0.3; }

  if (fireflyTime > fireflyNextFlash) {
    fireflyIsFlashing = true;
    fireflyFlashDur = flashLength + Math.random() * flashLength;
    fireflyNextFlash = fireflyTime + fireflyFlashDur + (Math.random() / flashChance) * 0.1;
  }
  if (fireflyTime < fireflyNextFlash - fireflyFlashDur) fireflyIsFlashing = false;

  // Scotopic vision (peripheral sees better in low light) - optimized
  let scotopicDim = 1.0;
  if (fireflyIsFlashing && oxygenLevel < 60) {
    const dx = fireflyMesh.position.x - camera.position.x;
    const dy = fireflyMesh.position.y - camera.position.y;
    const dz = fireflyMesh.position.z - camera.position.z;
    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;
    const lookDot = (_smoothFwd.x*dx + _smoothFwd.y*dy + _smoothFwd.z*dz) / dist;
    if (lookDot > 0.92) scotopicDim = lerp(1.0, 0.05, (lookDot - 0.92) * 12.5);
  }

  if (fireflyIsFlashing) {
    fireflyLight.intensity = intensity * scotopicDim * (0.8 + Math.random()*0.2);
    fireflyMat.opacity = 0.8 * scotopicDim;
    
    hallucinationLight.intensity = 0;
    if (panicLevel > 0.75 && Math.random() < 0.05) {
      hallucinationLight.position.copy(fireflyMesh.position).add(new V3(Math.random()-0.5, (Math.random()-0.5)*0.1, Math.random()-0.5));
      hallucinationLight.intensity = fireflyLight.intensity * 0.5;
    }
  } else {
    fireflyLight.intensity = 0;
    fireflyMat.opacity = 0.02;
    hallucinationLight.intensity = 0;
  }
  fireflyLight.color.copy(fColor); fireflyMat.color.copy(fColor);
}

function updateSurvival(dt) {
  if (gameState !== 'playing') { fatigue = Math.max(0, fatigue - dt * 0.2); return; }

  fatigue = clamp(fatigue + (exertionThisFrame > 0 ? dt * exertionThisFrame * 0.35 : -dt * 0.22), 0, 1);
  if (lidPushThisFrame) lidStress = clamp(lidStress + dt * 7, 0, 100);
  else lidStress = clamp(lidStress - dt * 1.5, 0, 100);

  const drain = (1.0 + exertionThisFrame * 2.2 + panic * 1.3) * (100 / 150);
  oxygen = clamp(oxygen - drain * dt, 0, 100);

  // CO2 Detachment Wave System - triggers at low oxygen
  co2WaveCooldown -= dt;
  if (oxygen > 5 && oxygen < 20 && co2WaveCooldown <= 0) {
    if (Math.random() < 0.003) {
      co2DetachmentWave = 1.0;
      co2WaveDuration = 2.5 + Math.random() * 1.5; // 2.5-4 seconds
      co2WaveTimer = 0;
      co2WaveCooldown = 15 + Math.random() * 10; // Don't retrigger for 15-25s
    }
  }
  
  // Update CO2 wave state
  if (co2DetachmentWave > 0) {
    co2WaveTimer += dt;
    if (co2WaveTimer >= co2WaveDuration) {
      co2DetachmentWave = Math.max(0, co2DetachmentWave - dt * 2.0); // Fade out
    }
  }

  let isCalm = (oxygen < 10);
  const shock = impactEnergy > 4 ? clamp((impactEnergy - 4) / 20, 0, 0.4) : 0;
  let panicTarget = clamp((35 - oxygen) / 35, 0, 1) * 0.85 + shock;
  if (isCalm) panicTarget = 0.05;
  
  // CO2 wave overrides panic temporarily
  if (co2DetachmentWave > 0.5) {
    panicTarget = lerp(panicTarget, 0.1, co2DetachmentWave); // Confusion/detachment, not calm
  }

  panic = lerp(panic, panicTarget, 1 - Math.exp(-dt * (panicTarget > panic ? 3 : 0.4)));

  updateVitalsAudio(dt, panic, oxygen);

  if (panic > 0.8 && Math.random() < 0.001) playHallucination();
  
  // Hallucinated presence whisper - very rare at high panic
  presenceWhisperCooldown -= dt;
  if (panic > 0.80 && presenceWhisperCooldown <= 0) {
    if (Math.random() < 0.0008) {
      playPresenceWhisper();
      presenceWhisperCooldown = 20 + Math.random() * 15; // 20-35 seconds between whispers
    }
  }

  creakCooldown -= dt;
  if (impactEnergy > 3.5 && creakCooldown <= 0) {
    playCreak(clamp(impactEnergy / 18, 0.15, 1));
    if (impactPos) spawnDust(impactPos, impactNormal, 3 + Math.floor(Math.min(impactEnergy, 12)));
    camShake = Math.max(camShake, clamp(impactEnergy / 5, 0, 2.5));
    shakeLid(clamp(impactEnergy / 8, 0.2, 1.6));
    creakCooldown = 0.35;
  }

  dirtCooldown -= dt;
  if (dirtCooldown <= 0) { 
    playDirtFall(); 
    dirtCooldown = 4 + Math.random() * 7; 
    shakeLid(0.18 + Math.random() * 0.15);
    spawnDust(new V3((Math.random()-0.5)*CX, CY - 0.05, (Math.random()-0.5)*CZ), new V3(0,-1,0), 4);
  }

  let clearPct = lerp(13, 6, panic).toFixed(1) + '%';
  let darkAmt = lerp(0.9, 0.985, clamp((40 - oxygen) / 40, 0, 1));
  targetFov = 85;

  let grayscale = 0, blur = 0, contrast = 1;
  
  // PHASE 1: Vision Tunneling (First to fail) - panic > 0.4 OR oxygen < 50
  const visionPhase1 = Math.max((panic - 0.4) / 0.6, (50 - oxygen) / 50);
  if (visionPhase1 > 0) {
    targetFov = lerp(85, 60, clamp(visionPhase1, 0, 1));
    clearPct = lerp(13, 6, clamp(visionPhase1, 0, 1)).toFixed(1) + '%';
    darkAmt = lerp(darkAmt, 0.985, clamp(visionPhase1 * 0.5, 0, 1));
    blur = visionPhase1 * 2.5;
    contrast = 1.0 - visionPhase1 * 0.3;
  }
  
  // CO2 wave visual effects
  if (co2DetachmentWave > 0) {
    grayscale = Math.max(grayscale, co2DetachmentWave * 0.6);
    contrast = Math.min(contrast, 1.0 - co2DetachmentWave * 0.2);
  }
  
  // Enhanced panic effects on top of phase 1
  if (panic > 0.5) grayscale = Math.max(grayscale, (panic - 0.5) / 0.5);
  if (panic > 0.8) {
    if (Math.random() < 0.01) targetFov = 110; 
  }

  if (isCalm) {
    grayscale = 0.4; blur = 0; contrast = 0.85; targetFov = 85; 
    clearPct = '15%'; darkAmt = 0.9;
  }

  // Throttle CSS updates for performance - only update every 3 frames
  cssUpdateCounter++;
  if (cssUpdateCounter >= 3) {
    cssUpdateCounter = 0;
    document.documentElement.style.setProperty('--clear', clearPct);
    document.documentElement.style.setProperty('--dark', darkAmt.toFixed(3));
    document.getElementById('c').style.filter = `grayscale(${grayscale.toFixed(2)}) blur(${blur.toFixed(1)}px) contrast(${contrast.toFixed(2)})`;
  }

  if (afterImageTimer > 0) {
    afterImageTimer -= dt;
    skyLight.intensity = (afterImageTimer / 3.0) * skyLightBase * 0.5;
    seamMat.opacity = clamp(skyLight.intensity / skyLightBase, 0, 1) * 0.85;
  } else {
    skyLight.intensity = 0;
    if (seamMesh.visible) { seamMat.opacity = 0; seamMesh.visible = false; }
  }

  updateFirefly(dt, oxygen, panic);

  if (lidStress >= 100) endGame('won');
  else if (oxygen <= 0) endGame('lost');
}

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', layout);
layout();

let last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let rawDt = last ? (now - last) / 1000 : 1 / 60; last = now;
  let pDt = rawDt;
  
  // PHASE 3: Time Dilation (Last to fail) - panic > 0.85 OR oxygen < 15
  const timePhase3 = Math.max(
    (panic - 0.85) / 0.15,
    (15 - oxygen) / 15
  );
  
  if (timePhase3 > 0 && oxygen >= 10) {
    const dilationAmount = clamp(timePhase3, 0, 1);
    pDt *= lerp(1.0, 0.3, dilationAmount); // Progressive time slowdown
  }
  
  const dt = Math.min(0.05, pDt); 
  
  physicsStep(dt);
  updateMeshes();
  if (gameState === 'intro') updateIntro(dt);
  else if (gameState === 'dying') updateDying(dt);
  else updateSurvival(dt);
  updateCamera(dt); // Now properly reads mouse input via head position
  updateDust(dt, oxygen, panic);
  updateLidShake(dt);

  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

})();
</script>
